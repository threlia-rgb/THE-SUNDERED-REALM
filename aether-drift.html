<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aether Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Spectral:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0817; --panel:#171130; --line:#332a55;
    --aether:#57e0c8; --gold:#e8c15a; --claret:#e2506a; --ink:#ece4d1; --dim:#a89f8e;
  }
  *{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;background:var(--void);overflow:hidden;font-family:'Spectral',Georgia,serif;color:var(--ink);}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(130% 110% at 50% 0%,#1b1440 0%,#0a0716 68%);}
  #stage{position:relative;width:100%;height:100%;max-width:520px;max-height:920px;margin:auto;}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none;}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:flex-start;
    justify-content:space-between;pointer-events:none;}
  #score{font-family:'Cinzel',serif;font-size:30px;color:var(--ink);line-height:1;
    text-shadow:0 2px 10px rgba(0,0,0,.6);}
  #score small{display:block;font-family:'Spectral';font-size:11px;letter-spacing:.22em;color:var(--dim);margin-bottom:4px;}
  #combo{font-family:'Cinzel',serif;font-size:15px;color:var(--aether);margin-top:6px;height:18px;
    transition:transform .1s;transform-origin:left;}
  #lives{display:flex;gap:5px;font-size:19px;}

  /* overlays */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;background:rgba(8,6,18,.72);backdrop-filter:blur(3px);}
  .screen.show{display:flex;}
  .mark{font-size:60px;filter:drop-shadow(0 0 26px var(--aether));margin-bottom:6px;}
  h1{font-family:'Cinzel',serif;font-weight:700;font-size:38px;letter-spacing:.08em;color:var(--ink);
    text-shadow:0 0 30px rgba(87,224,200,.35);}
  .tag{color:var(--aether);font-style:italic;letter-spacing:.14em;font-size:13px;margin:8px 0 26px;}
  .how{color:var(--dim);font-size:13.5px;line-height:1.7;max-width:300px;margin-bottom:26px;}
  .how b{color:var(--ink);font-style:normal;}
  .play{font-family:'Cinzel',serif;letter-spacing:.06em;font-size:16px;color:var(--void);
    background:linear-gradient(180deg,#7ff0da,#3fbfa6);border:none;padding:14px 40px;cursor:pointer;
    box-shadow:0 8px 30px rgba(87,224,200,.35);transition:transform .06s;}
  .play:active{transform:translateY(2px);}
  .final{font-family:'Cinzel',serif;font-size:56px;color:var(--gold);margin:4px 0;text-shadow:0 0 30px rgba(232,193,90,.4);}
  .final small{display:block;font-family:'Spectral';font-size:12px;letter-spacing:.2em;color:var(--dim);}
  .best{color:var(--dim);font-size:13px;margin:2px 0 26px;letter-spacing:.05em;}
  .newbest{color:var(--gold);font-style:italic;animation:pulse 1.2s infinite;}
  @keyframes pulse{50%{opacity:.5}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div>
      <div id="score"><small>SCORE</small>0</div>
      <div id="combo"></div>
    </div>
    <div id="lives"></div>
  </div>

  <div class="screen show" id="titleScreen">
    <div class="mark">✦</div>
    <h1>AETHER DRIFT</h1>
    <div class="tag">CATCH&nbsp;THE&nbsp;LIGHT</div>
    <div class="how">
      <b>Drag</b> to glide your orb (or use the mouse / arrow keys).<br>
      Gather <b style="color:var(--aether)">◆ aether</b> to build your combo.<br>
      Dodge the <b style="color:var(--claret)">✸ shards</b>.<br>
      A rare <b style="color:var(--gold)">★ starmote</b> bends time itself.
    </div>
    <button class="play" id="startBtn">Play</button>
  </div>

  <div class="screen" id="overScreen">
    <div class="mark" style="filter:drop-shadow(0 0 26px var(--claret))">✷</div>
    <div class="final"><small>YOUR SCORE</small><span id="finalScore">0</span></div>
    <div class="best" id="bestLine"></div>
    <button class="play" id="againBtn">Play Again</button>
  </div>
</div></div>

<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0,H=0,DPR=1;
function resize(){
  const st=document.getElementById('stage');
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=st.clientWidth; H=st.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

/* ---------- state ---------- */
let G=null;
function newGame(){
  G={
    running:true, over:false,
    player:{x:W/2,y:H*0.8,tx:W/2,ty:H*0.8,r:16},
    orbs:[], particles:[], stars:[],
    score:0, combo:0, best:loadBest(),
    lives:3, elapsed:0, spawnT:0, spawnGap:0.85,
    shake:0, timeScale:1, timeTarget:1, flash:0, invuln:0
  };
  for(let i=0;i<60;i++) G.stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.9+0.1});
  renderLives();
}
function loadBest(){ try{return +localStorage.getItem('aetherdrift_best')||0;}catch(e){return 0;} }
function saveBest(v){ try{localStorage.setItem('aetherdrift_best',v);}catch(e){} }

/* ---------- input ---------- */
function setTarget(cx,cy){ if(!G) return; const r=cv.getBoundingClientRect();
  G.player.tx=(cx-r.left); G.player.ty=(cy-r.top); }
cv.addEventListener('pointermove',e=>{e.preventDefault(); setTarget(e.clientX,e.clientY);},{passive:false});
cv.addEventListener('pointerdown',e=>{e.preventDefault(); setTarget(e.clientX,e.clientY);},{passive:false});
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* ---------- spawn ---------- */
function spawn(){
  const roll=Math.random();
  let type='aether';
  if(roll<0.045) type='star';
  else if(roll<0.045+difficultyShardRate()) type='shard';
  const r = type==='shard'? 15 : type==='star'? 18 : 13;
  const x = r + Math.random()*(W-2*r);
  const speed = (H*0.14) * (1 + G.elapsed*0.018) * (type==='shard'?1.15:1) * (0.85+Math.random()*0.4);
  G.orbs.push({type,x,y:-r,r,vx:(Math.random()-0.5)*40,vy:speed,spin:Math.random()*6, wob:Math.random()*6});
}
function difficultyShardRate(){ return Math.min(0.5, 0.18 + G.elapsed*0.006); }

/* ---------- particles ---------- */
function burst(x,y,color,n,spd){
  if(reduceMotion) n=Math.min(n,6);
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=(0.4+Math.random())*spd;
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:1.5+Math.random()*2.5}); }
}

/* ---------- update ---------- */
let last=performance.now();
function frame(now){
  const rawDt=Math.min(0.05,(now-last)/1000); last=now;
  if(G && G.running){ update(rawDt); }
  draw();
  requestAnimationFrame(frame);
}
function update(rawDt){
  // ease time scale (slow-mo)
  G.timeScale += (G.timeTarget-G.timeScale)*Math.min(1,rawDt*6);
  if(G.timeTarget<1 && G.timeScale<0.98){ G._slowLeft-=rawDt; if(G._slowLeft<=0) G.timeTarget=1; }
  const dt=rawDt*G.timeScale;
  G.elapsed+=dt;
  G.spawnGap=Math.max(0.32, 0.85 - G.elapsed*0.012);

  // player: keyboard nudges target
  const sp=520*rawDt;
  if(keys['arrowleft']||keys['a']) G.player.tx-=sp;
  if(keys['arrowright']||keys['d']) G.player.tx+=sp;
  if(keys['arrowup']||keys['w']) G.player.ty-=sp;
  if(keys['arrowdown']||keys['s']) G.player.ty+=sp;
  G.player.tx=Math.max(0,Math.min(W,G.player.tx));
  G.player.ty=Math.max(0,Math.min(H,G.player.ty));
  G.player.x += (G.player.tx-G.player.x)*Math.min(1,rawDt*14);
  G.player.y += (G.player.ty-G.player.y)*Math.min(1,rawDt*14);

  if(G.invuln>0) G.invuln-=rawDt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-rawDt*3);
  if(G.flash>0) G.flash=Math.max(0,G.flash-rawDt*2.5);

  // spawn
  G.spawnT-=dt;
  if(G.spawnT<=0){ spawn(); G.spawnT=G.spawnGap*(0.7+Math.random()*0.6); }

  // stars drift
  G.stars.forEach(s=>{ s.y+=(14+s.z*30)*dt; if(s.y>H){s.y=0;s.x=Math.random()*W;} });

  // orbs
  const p=G.player;
  for(let i=G.orbs.length-1;i>=0;i--){
    const o=G.orbs[i];
    o.wob+=dt*4;
    o.x+=o.vx*dt + Math.sin(o.wob)*8*dt;
    o.y+=o.vy*dt; o.spin+=dt*3;
    // collision
    const dx=o.x-p.x, dy=o.y-p.y, dist=Math.hypot(dx,dy);
    if(dist < o.r+p.r-2){
      if(o.type==='shard'){
        if(G.invuln<=0){ hit(); }
      } else {
        collect(o); G.orbs.splice(i,1); continue;
      }
    }
    if(o.y-o.r>H){
      if(o.type==='aether'||o.type==='star'){ if(G.combo>0){ G.combo=0; renderCombo(); } }
      G.orbs.splice(i,1);
    }
  }

  // particles
  for(let i=G.particles.length-1;i>=0;i--){ const pa=G.particles[i];
    pa.x+=pa.vx*dt*60; pa.y+=pa.vy*dt*60; pa.vy+=60*dt; pa.life-=dt*1.6;
    if(pa.life<=0) G.particles.splice(i,1); }
}
function collect(o){
  const mult=1+Math.floor(G.combo/5);
  if(o.type==='star'){
    G.score += 250; G.combo+=5;
    G.timeTarget=0.35; G.timeScale=0.35; G._slowLeft=1.1;
    burst(o.x,o.y,'232,193,90',26,5); G.flash=0.5;
  } else {
    G.combo++;
    G.score += 10*mult;
    burst(o.x,o.y,'87,224,200',12,3.4);
  }
  renderScore(); renderCombo();
}
function hit(){
  G.lives--; G.combo=0; G.invuln=1.3;
  G.shake=1; G.flash=0.6;
  burst(G.player.x,G.player.y,'226,80,106',24,5);
  renderLives(); renderCombo();
  if(G.lives<=0) gameOver();
}
function gameOver(){
  G.running=false; G.over=true;
  const nb = G.score>G.best;
  if(nb){ G.best=G.score; saveBest(G.best); }
  $('finalScore').textContent=G.score;
  $('bestLine').innerHTML = nb? '<span class="newbest">✦ New best!</span>'
    : ('Best · '+G.best);
  $('overScreen').classList.add('show');
}

/* ---------- draw ---------- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // subtle vignette background pulse
  ctx.fillStyle='rgba(10,7,22,1)'; ctx.fillRect(0,0,W,H);

  let sx=0,sy=0;
  if(G && G.shake>0 && !reduceMotion){ const m=G.shake*10; sx=(Math.random()-0.5)*m; sy=(Math.random()-0.5)*m; }
  ctx.save(); ctx.translate(sx,sy);

  // stars
  if(G) G.stars.forEach(s=>{ ctx.globalAlpha=0.25+s.z*0.5; ctx.fillStyle='#8fa6d8';
    ctx.fillRect(s.x,s.y,s.z*2.2,s.z*2.2); });
  ctx.globalAlpha=1;

  if(G){
    // orbs
    G.orbs.forEach(o=>drawOrb(o));
    // player
    drawPlayer();
    // particles
    G.particles.forEach(pa=>{ ctx.globalAlpha=Math.max(0,pa.life);
      ctx.fillStyle='rgba('+pa.color+','+Math.max(0,pa.life)+')';
      ctx.beginPath(); ctx.arc(pa.x,pa.y,pa.r,0,7); ctx.fill(); });
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // flash overlay
  if(G && G.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(G.flash*0.18)+')'; ctx.fillRect(0,0,W,H); }
}
function glow(x,y,r,color,inner){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,inner||color); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}
function drawOrb(o){
  if(o.type==='aether'){
    glow(o.x,o.y,o.r*2.6,'rgba(87,224,200,0.28)');
    ctx.fillStyle='#57e0c8'; diamond(o.x,o.y,o.r);
    ctx.fillStyle='rgba(255,255,255,.85)'; diamond(o.x,o.y,o.r*0.42);
  } else if(o.type==='star'){
    glow(o.x,o.y,o.r*3,'rgba(232,193,90,0.35)');
    star(o.x,o.y,o.r,5,'#e8c15a','#fff3cf',o.spin);
  } else { // shard
    glow(o.x,o.y,o.r*2.4,'rgba(226,80,106,0.28)');
    ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.spin);
    ctx.fillStyle='#e2506a';
    ctx.beginPath();
    for(let i=0;i<4;i++){ const a=i/4*Math.PI*2; const rr = i%2? o.r*0.5:o.r*1.15;
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,220,225,.8)'; ctx.beginPath(); ctx.arc(0,0,o.r*0.25,0,7); ctx.fill();
    ctx.restore();
  }
}
function drawPlayer(){
  const p=G.player;
  const blink = G.invuln>0 && Math.floor(G.invuln*12)%2===0;
  if(blink) ctx.globalAlpha=0.4;
  glow(p.x,p.y,p.r*3.2,'rgba(232,193,90,0.22)');
  // ring
  ctx.strokeStyle='rgba(87,224,200,0.9)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
  // core
  ctx.fillStyle='#fdf6e3'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.55,0,7); ctx.fill();
  ctx.globalAlpha=1;
}
function diamond(x,y,r){ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4);
  ctx.fillRect(-r*0.7,-r*0.7,r*1.4,r*1.4); ctx.restore(); }
function star(x,y,r,pts,fill,inner,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.beginPath();
  for(let i=0;i<pts*2;i++){ const a=i/(pts*2)*Math.PI*2 - Math.PI/2; const rr=i%2? r:r*0.45;
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,r*0.3,0,7); ctx.fillStyle=inner; ctx.fill();
  ctx.restore();
}

/* ---------- HUD render ---------- */
function renderScore(){ $('score').innerHTML='<small>SCORE</small>'+G.score; }
function renderCombo(){
  const c=$('combo');
  if(G.combo>=2){ const mult=1+Math.floor(G.combo/5);
    c.textContent='✦ '+G.combo+' combo'+(mult>1?('  ×'+mult):'');
    c.style.transform='scale(1.18)'; setTimeout(()=>c.style.transform='scale(1)',90);
  } else c.textContent='';
}
function renderLives(){ $('lives').innerHTML = Array.from({length:3},(_,i)=>
  '<span style="opacity:'+(i<G.lives?1:0.2)+'">'+(i<G.lives?'💠':'◇')+'</span>').join(''); }

/* ---------- flow ---------- */
function start(){ $('titleScreen').classList.remove('show'); $('overScreen').classList.remove('show');
  newGame(); renderScore(); renderCombo(); last=performance.now(); }
$('startBtn').onclick=start;
$('againBtn').onclick=start;

newGame(); G.running=false; // idle world behind title
requestAnimationFrame(frame);
</script>
</body>
</html>
